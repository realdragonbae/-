    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: linear-gradient(to bottom, #090a0f, #111827, #070a12);
            color: #f3f4f6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .font-batang {
            font-family: 'Gowun Batang', serif;
        }

        /* 별 배경 효과 */
        .star {
            position: absolute;
            background-color: #ffffff;
            border-radius: 50%;
            animation: twinkle var(--duration) infinite ease-in-out alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1.3); filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.8)); }
        }

        /* 달 그림자 & 글로우 효과 */
        .moon-glow {
            box-shadow: 0 0 50px 15px rgba(254, 240, 138, 0.25), inset -15px -15px 30px rgba(0,0,0,0.5);
        }

        /* 카드 뒤집기 (3D Flip) 스타일 */
        .perspective-1000 {
            perspective: 1000px;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .flip-card-inner.flipped {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 1rem;
        }

        .flip-card-back {
            transform: rotateY(180deg);
        }

        /* glassmorphism 효과 */
        .glass-panel {
            background: rgba(17, 24, 39, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-card {
            background: rgba(31, 41, 55, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* 애니메이션 효과 */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(250, 204, 21, 0.4)); }
            50% { filter: drop-shadow(0 0 25px rgba(250, 204, 21, 0.8)); }
        }

        .moon-pulse {
            animation: pulse-glow 3s infinite alternate;
        }
    </style>
